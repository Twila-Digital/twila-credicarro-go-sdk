name: Security

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: go

      - uses: github/codeql-action/analyze@v4
        with:
          category: security-codeql
